# 生产部署（Linux / Docker Compose）：MySQL 8 + 应用单端口
# 用法：docker compose -f docker-compose.prod.yml up -d --build
# 说明：MySQL 不映射宿主端口，避免与宿主机已有 MySQL/MariaDB（3306）冲突
name: oneperson-la

services:
  mysql:
    image: mysql:8.0
    container_name: oneperson-la-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: oneperson_la
      MYSQL_USER: la
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oneperson-la:latest
    container_name: oneperson-la-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      TZ: Asia/Shanghai
    ports:
      - '${APP_PORT:-8080}:3001'
    volumes:
      # Obsidian 仓库只读挂载；容器内路径固定为 /vault，连接器里填 /vault/子目录
      - type: bind
        source: ${OBSIDIAN_VAULT:-/mnt/nextcloud_data}
        target: /vault
        read_only: true

volumes:
  mysql_data:
