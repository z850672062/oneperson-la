# 本地开发用 MySQL 8（数据卷持久化；生产请用独立 MySQL 实例）
# 启动：docker compose up -d
# 连接：mysql://la:LaLocal2026!@127.0.0.1:3306/oneperson_la
services:
  mysql:
    image: mysql:8.0
    container_name: oneperson-la-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootLocal2026!}
      MYSQL_DATABASE: oneperson_la
      MYSQL_USER: la
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-LaLocal2026!}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ula", "-p${MYSQL_PASSWORD:-LaLocal2026!}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
